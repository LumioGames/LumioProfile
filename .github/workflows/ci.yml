name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:optional
      - run: npm run setup:perfetto
      - run: npm run verify:perfetto
      - run: npm run demo
      - run: npm run verify:docs
      - name: Install Chrome for headless browser verification
        if: matrix.os == 'ubuntu-latest'
        run: npx playwright install chrome
      - name: Run browser end-to-end verification
        if: matrix.os == 'ubuntu-latest'
        run: npm run verify:browser
